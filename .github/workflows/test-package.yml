name: Test package against Go versions

permissions:
  contents: read

on: [ push ]
jobs:
  test:
    runs-on: ${{ matrix.os }}-latest
    defaults:
      run:
        working-directory: 'go/src/github.com/bugsnag/bugsnag-go-performance' # relative to $GITHUB_WORKSPACE
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu]
        go-version: ['1.22', '1.23', '1.24', '1.25', '1.26', '1.27']
        otel-version: ['1.33.0', '1.34.0', '1.35.0', '1.36.0', '1.37.0', '1.38.0', '1.39.0', '1.40.0', '1.41.0', '1.42.0', '1.43.0', '1.44.0', '1.45.0', '1.46.0', '1.47.0']
        exclude:
          # OTel 1.36+ requires Go 1.23+.
          - go-version: '1.22'
            otel-version: '1.36.0'
          - go-version: '1.22'
            otel-version: '1.37.0'
          - go-version: '1.22'
            otel-version: '1.38.0'
          - go-version: '1.22'
            otel-version: '1.39.0'
          - go-version: '1.22'
            otel-version: '1.40.0'
          - go-version: '1.22'
            otel-version: '1.41.0'
          - go-version: '1.22'
            otel-version: '1.42.0'
          - go-version: '1.22'
            otel-version: '1.43.0'
          - go-version: '1.22'
            otel-version: '1.44.0'
          - go-version: '1.22'
            otel-version: '1.45.0'
          - go-version: '1.22'
            otel-version: '1.46.0'
          - go-version: '1.22'
            otel-version: '1.47.0'
          # OTel 1.39+ requires Go 1.24+.
          - go-version: '1.23'
            otel-version: '1.39.0'
          - go-version: '1.23'
            otel-version: '1.40.0'
          - go-version: '1.23'
            otel-version: '1.41.0'
          - go-version: '1.23'
            otel-version: '1.42.0'
          - go-version: '1.23'
            otel-version: '1.43.0'
          - go-version: '1.23'
            otel-version: '1.44.0'
          - go-version: '1.23'
            otel-version: '1.45.0'
          - go-version: '1.23'
            otel-version: '1.46.0'
          - go-version: '1.23'
            otel-version: '1.47.0'
          # OTel 1.42+ requires Go 1.25+.
          - go-version: '1.24'
            otel-version: '1.42.0'
          - go-version: '1.24'
            otel-version: '1.43.0'
          - go-version: '1.24'
            otel-version: '1.44.0'
          - go-version: '1.24'
            otel-version: '1.45.0'
          - go-version: '1.24'
            otel-version: '1.46.0'
          - go-version: '1.24'
            otel-version: '1.47.0'
          # OTel 1.47 requires Go 1.26+.
          - go-version: '1.25'
            otel-version: '1.47.0'

    steps:
    - uses: actions/checkout@v4
      with:
        path: 'go/src/github.com/bugsnag/bugsnag-go-performance' # relative to $GITHUB_WORKSPACE
    - name: set GOPATH
      if: matrix.os == 'ubuntu'
      run: |
        bash -c 'echo "GOPATH=$GITHUB_WORKSPACE/go" >> $GITHUB_ENV'
    - name: set GOPATH
      if: matrix.os == 'windows'
      run: |
        bash -c 'echo "GOPATH=$GITHUB_WORKSPACE\\\\go" >> $GITHUB_ENV'
    - name: set GO111MODULE
      run: |
        bash -c 'echo "GO111MODULE=on" >> $GITHUB_ENV'
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache-dependency-path: go/src/github.com/bugsnag/bugsnag-go-performance/go.sum
    - name: install dependencies
      run: |
        go get go.opentelemetry.io/otel@v${{ matrix.otel-version }} \
          go.opentelemetry.io/otel/sdk@v${{ matrix.otel-version }}
        go mod tidy
    - name: run tests
      run: go test $(go list ./... | grep -v /features/)
    - name: vet package
      # go1.12 vet shows spurious 'unknown identifier' issues
      if: matrix.go-version != '1.12'
      run: go vet $(go list ./... | grep -v /features/)

    - name: install integration dependencies
      if: matrix.os == 'ubuntu'
      run: |
        sudo apt-get update
        sudo apt-get install libcurl4-openssl-dev

    - name: install Ruby
      if: matrix.os == 'ubuntu'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: go/src/github.com/bugsnag/bugsnag-go-performance # relative to $GITHUB_WORKSPACE
    - name: maze tests
      working-directory: go/src/github.com/bugsnag/bugsnag-go-performance
      if: matrix.os == 'ubuntu'
      env:
        GO_VERSION: ${{ matrix.go-version }}
        OTEL_VERSION: ${{ matrix.otel-version }}
      run: DEBUG=1 bundle exec maze-runner --color --format progress

  test-results:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}
    steps:
    - name: Check test matrix results
      env:
        TEST_RESULT: ${{ needs.test.result }}
      run: |
        if [ "$TEST_RESULT" != "success" ]; then
          echo "Test matrix did not succeed: $TEST_RESULT"
          exit 1
        fi
